kind = "web"
previewPath = "/"
title = "NX Rental"
description = "A polished single-page vehicle rental ecosystem website connecting rental businesses with customers through management tools and a discoverable marketplace."
version = "1.0.0"
id = "artifacts/nx-rental"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20511

[services.development]
run = "pnpm --filter @workspace/nx-rental run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nx-rental", "run", "build" ]
serve = "static"
publicDir = "artifacts/nx-rental/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20511"
BASE_PATH = "/"
